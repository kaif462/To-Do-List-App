<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tasks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{navbar :: navbar}"></div>

<div class="container mt-4">

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Search + filter -->
    <form th:action="@{/view-task}" method="get" class="row g-2 mb-3">
        <div class="col-md-5">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="Search by title...">
        </div>
        <div class="col-md-4">
            <select name="status" class="form-select">
                <option value="">All statuses</option>
                <option th:each="opt : ${options}"
                        th:value="${opt}"
                        th:text="${opt}"
                        th:selected="${opt == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-md-3 d-grid d-md-flex gap-2">
            <button type="submit" class="btn btn-primary">Apply</button>
            <a th:href="@{/view-task}" class="btn btn-outline-secondary">Reset</a>
        </div>
    </form>

    <!-- Table -->
    <table class="table table-bordered bg-white align-middle">
        <thead class="table-light">
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Status</th>
            <th style="width:160px">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}" th:classappend="${task.overdue} ? 'table-danger'">
            <td th:text="${task.title}">Title</td>
            <td th:text="${task.description}">Desc</td>
            <td>
                <span th:text="${task.date}">2026-01-01</span>
                <span th:if="${task.overdue}" class="badge bg-danger ms-1">Overdue</span>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${task.status.name() == 'DONE'} ? 'bg-success'
                         : (${task.status.name() == 'IN_PROGRESS'} ? 'bg-warning text-dark' : 'bg-secondary')"
                      th:text="${task.status}">TODO</span>
            </td>
            <td>
                <a th:href="@{/edit/{id}(id=${task.id})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/delete/{id}(id=${task.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Are you sure you want to delete this task?');">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tasks)}">
            <td colspan="5" class="text-center text-muted">No tasks found.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
