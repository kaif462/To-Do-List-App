<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-primary px-3">
    <a class="navbar-brand fw-bold" th:href="@{/}">ToDo App</a>
    <div class="navbar-nav me-auto">
        <a class="nav-link" th:href="@{/}">Home</a>
        <a class="nav-link" th:href="@{/view-task}">All Tasks</a>
        <a class="nav-link" th:href="@{/task-form}">+ Add Task</a>
    </div>
    <div class="d-flex align-items-center text-white" th:if="${username}">
        <span class="me-3">Hi, <strong th:text="${username}">user</strong></span>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>
</body>
</html>
