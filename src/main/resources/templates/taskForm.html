<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task From</title>
    <!-- Optional: Bootstrap CSS for quick styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<form th:action="@{/view-task}" class="text-end p-3">
<button type="submit" class="btn btn-primary m-10 ">View Task</button>
</form>

<div class="container mt-5">
    <div class="card shadow-sm mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title mb-0">Task Information</h3>
        </div>
        <div class="card-body">
            
            <!-- Form binding to the 'passenger' object -->
            <form th:action="@{/add-task}" th:object="${task}" method="post" >
                
                <!-- Hidden Field for ID (Important for updates, safe for new entries if null) -->
                 <div class="mb-3">
              
                <input type ="hidden" th:field="*{id}" />
                   </div>

                <!-- Name Field -->
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Enter Title" required />
                </div>

                <!-- Departure Field -->
                <div class="mb-3">
                    <label for="desc" class="form-label">Description</label>
                    <input type="text" id="desc" th:field="*{description}" class="form-control" placeholder="Description" required />
                </div>

  

                <!-- Date of Journey Field -->
                <div class="mb-4">
                    <label for="date" class="form-label">Date</label>
                    <!-- Using type="date" ensures a native browser date-picker popup -->
                    <input type="date" id="date" th:field="*{date}" class="form-control" required />
                </div>
            <!--    <div class="mb-3">
                    <label for="status" class="form-label">Description</label>
                    <input type="text" id="status" th:field="*{status}" class="form-control" placeholder="Status" required />
                </div>
                 -->
                  <select th:field="*{status}" class="form-select mb-3">
                      <option th:each="opt : ${options}" 
                           th:value="${opt}" 
                            th:text="${opt}">
                       </option>
                  </select>   

                <!-- Action Buttons -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Add Task</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
                
            </form>
            
        </div>
    </div>
</div>

</body>
</html>
